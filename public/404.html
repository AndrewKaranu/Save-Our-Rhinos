<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=/Save-Our-Rhinos/">
    <link rel="canonical" href="/Save-Our-Rhinos/">
  </head>
  <body>
    <script>
      // Single Page App redirect for GitHub Pages
      // Source: https://github.com/rafgraph/spa-github-pages
      (function(l) {
        var path = l.pathname;
        // Ensure we always land back on the app base
        if (!path.startsWith('/Save-Our-Rhinos/')) {
          l.replace('/Save-Our-Rhinos/');
        }
      })(window.location);
    </script>
  </body>
  </html>
